name: Build Blackground APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Fetch libusb Source & Headers
        run: |
          mkdir -p app/src/main/cpp/external
          if [ ! -d "app/src/main/cpp/external/libusb" ]; then
            git clone --depth 1 https://github.com/libusb/libusb.git app/src/main/cpp/external/libusb
          fi
          mkdir -p app/src/main/cpp/include
          cp app/src/main/cpp/external/libusb/android/config.h app/src/main/cpp/include/config.h
          echo '#define LIBUSB_DESCRIBE "1.0.27-blackground"' > app/src/main/cpp/include/version_describe.h

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses & Install NDK + CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: Install Gradle 8.5 Directly
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
          sudo unzip -q -d /opt/gradle /tmp/gradle.zip
          echo "/opt/gradle/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Compile C++20 & Assemble APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blackground-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
